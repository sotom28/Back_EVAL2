services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment: 
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: proyecto_db
    ports:
      - "3306:3306"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: sotom30/backend:latest  # <--- CAMBIA ESTO (Pon tu usuario real de Docker Hub)
    container_name: backend-app
    ports:
      - "8080:3000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend-data:/app/data



volumes:
  backend-data:
    driver: local
  mysql-data:
    driver: local