name: CI/CD Backend

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_BACK_EV2 }}

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Copiar docker-compose.yml a EC2 frontend (bastion)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST_EV2 }}
          username: ${{ secrets.EC2_USER_EV2 }}
          key: ${{ secrets.EC2_SSH_KEY_EV2 }}
          source: "docker-compose.yml"
          target: "/tmp/backend-compose"

      - name: Deploy backend via bastion (frontend EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST_EV2 }}
          username: ${{ secrets.EC2_USER_EV2 }}
          key: ${{ secrets.EC2_SSH_KEY_EV2 }}
          script: |
            # Crear la key del backend en la EC2 frontend
            echo "${{ secrets.EC2_SSH_KEYBACK_EV2 }}" > ~/BackEV2.pem
            chmod 600 ~/BackEV2.pem

            # Crear carpeta en el backend
            ssh -i ~/BackEV2.pem \
                -o StrictHostKeyChecking=no \
                ${{ secrets.EC2_BACKEND_EV2 }}@${{ secrets.EC2_BACKEND_PRIVATE_IP }} \
                "mkdir -p /home/ec2-user/app"

            # Copiar compose al backend
            scp -i ~/BackEV2.pem \
                -o StrictHostKeyChecking=no \
                /tmp/backend-compose/docker-compose.yml \
                ${{ secrets.EC2_BACKEND_EV2 }}@${{ secrets.EC2_BACKEND_PRIVATE_IP }}:/home/ec2-user/app/docker-compose.yml

            # Deploy en el backend
            ssh -i ~/BackEV2.pem \
                -o StrictHostKeyChecking=no \
                ${{ secrets.EC2_BACKEND_EV2 }}@${{ secrets.EC2_BACKEND_PRIVATE_IP }} \
                "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest && \
                 cd /home/ec2-user/app && \
                 docker compose down && \
                 docker compose up -d && \
                 docker compose ps"

           